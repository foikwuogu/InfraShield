# Local Postgres for development.
# Start with: docker compose up -d
# Then run the server's migrate + seed scripts against it.
services:
  db:
    image: postgres:16-alpine
    container_name: infrashield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: infrashield
      POSTGRES_PASSWORD: infrashield
      POSTGRES_DB: infrashield
    ports:
      - "5434:5432"
    volumes:
      - infrashield_pgdata:/var/lib/postgresql/data

volumes:
  infrashield_pgdata:
