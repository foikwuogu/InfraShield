name: Deploy InfraShield to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Validate hosted API configuration
        run: |
          node --input-type=module <<'NODE'
          if (!process.env.VITE_API_URL) {
            console.log('::warning::Publishing the frontend only. Configure VITE_API_URL to enable sign-in and live dashboards.');
            process.exit(0);
          }
          const url = new URL(process.env.VITE_API_URL);
          if (url.protocol !== 'https:' || ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname) || url.username || url.password || url.search || url.hash || !url.pathname.endsWith('/api')) {
            throw new Error('Set the repository variable VITE_API_URL to your public HTTPS API URL ending in /api, without credentials or a trailing slash.');
          }
          NODE
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@v4